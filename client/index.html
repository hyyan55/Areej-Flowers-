<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <script>
      // /contact has its own 9KB static page (contact.html) that opens at once
      // on any connection. Redirect there immediately, BEFORE the 578KB app
      // bundle even starts downloading — no Render setting needed for this.
      // (The /contact -> /contact.html rewrite in Render does the same
      // server-side when present; this makes it work even without that rule.)
      // Only runs on a real page load; in-app navigation (pushState) is untouched.
      (function () {
        var p = window.location.pathname;
        if (p === "/contact" || p === "/contact/") {
          window.location.replace("/contact.html" + window.location.search + window.location.hash);
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="مساحة للكلمات، والمعرفة، والأثر الجميل. مدونة أريج خضر محمد النور — كاتبة وصانعة محتوى تعليمي وتثقيفي من كسلا، السودان." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%2379509B'/%3E%3Ctext x='50' y='66' font-size='48' text-anchor='middle' fill='%23fff' font-family='serif'%3EA%3C/text%3E%3C/svg%3E" />
    <!-- Fonts load without blocking the first paint: the page renders at once
         with fallback fonts and swaps to Cairo/Playfair/Inter when they arrive.
         (The old @import inside the CSS blocked rendering until Google Fonts answered.) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500&family=Inter:wght@400;500;600;700&display=swap" /></noscript>
    <title>Areej Flowers | أريج خضر محمد النور</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
