# Render static site for Areej Flowers
# Deploy from GitHub: Render -> New -> Static Site -> pick the repo.
# No environment variables are needed: the Supabase publishable key is
# embedded in client/src/api.ts (it is public by design).

services:
  - type: web
    name: areej-flowers
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # Lightweight static contact page (client/public/contact.html): it must
      # be served directly so /contact opens instantly without the JS bundle.
      # Rules are matched in order, so this goes BEFORE the SPA catch-all.
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /*
        destination: /index.html
