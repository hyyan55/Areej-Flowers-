<script>
/* Anti-flash: apply saved mode / preset / language before first paint */
(function(){
  try{
    var s = JSON.parse(localStorage.getItem('af_settings')||'{}');
    var mode = s.mode || localStorage.getItem('af_mode') || 'light';
    var preset = s.preset || localStorage.getItem('af_preset') || 'lavender';
    var lang = s.lang || localStorage.getItem('af_lang') || 'ar';
    var root = document.documentElement;
    root.setAttribute('data-mode', mode);
    root.setAttribute('data-preset', preset);
    root.setAttribute('lang', lang);
    root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
  }catch(e){}
})();
</script>
<style>
/* ============ Areej Flowers — Design System ============ */
*,*::before,*::after{box-sizing:border-box}
:root{
  --purple:#79509B; --deep:#49305F; --lavender:#A77BC5; --pink:#E7A8CB;
  --soft-pink:#F3D6E7; --blue:#668FC2; --soft-blue:#E7EFF8; --gray:#85858F;
  --light-gray:#F0F0F3; --dark-gray:#34343D; --bg-light:#F8F3FA; --bg-dark:#211827;
  --radius:18px; --radius-sm:12px; --gap:24px; --max:1120px;
  --font-head:'Playfair Display','Cairo',serif;
  --font-body:'Inter','Cairo',sans-serif;
  --shadow:0 10px 30px rgba(73,48,95,.10);
  --shadow-sm:0 4px 14px rgba(73,48,95,.08);
}
/* --- Base palette: Lavender Elegance (default) --- */
html[data-mode="light"]{--bg:#F8F3FA;--surface:#FFFFFF;--surface-2:#F3EAF8;--text:#2A2140;--muted:#6B6580;--border:#E4D8EE;--primary:#79509B;--primary-deep:#49305F;--secondary:#E7A8CB;--accent:#668FC2;--soft-blue:#E7EFF8;--soft-pink:#F3D6E7;--gray:#85858F;--header-bg:#FFFFFF;--header-text:#2A2140;--hero-bg:linear-gradient(160deg,#F3EAF8 0%,#F8F3FA 55%,#F3D6E7 100%)}
html[data-mode="dark"]{--bg:#211827;--surface:#2C2138;--surface-2:#38294A;--text:#F1EAF6;--muted:#B9AECB;--border:#3D2F52;--primary:#A77BC5;--primary-deep:#C7A9DF;--secondary:#E7A8CB;--accent:#8FB0D8;--soft-blue:#2C3A55;--soft-pink:#4A3350;--gray:#9A94A3;--header-bg:#2C2138;--header-text:#F1EAF6;--hero-bg:linear-gradient(160deg,#2C2138 0%,#211827 60%,#38294A 100%)}
/* --- Preset 2: Royal Purple --- */
html[data-preset="royal"][data-mode="light"]{--bg:#F3EDF7;--surface:#FFFFFF;--surface-2:#EFE4F4;--text:#241533;--muted:#5E5270;--border:#D8C4E4;--primary:#49305F;--primary-deep:#2E1C40;--secondary:#D99ABF;--accent:#668FC2;--radius:10px;--header-bg:#49305F;--header-text:#FFFFFF;--hero-bg:linear-gradient(160deg,#49305F 0%,#5C3D7A 60%,#79509B 100%)}
html[data-preset="royal"][data-mode="dark"]{--bg:#1A1226;--surface:#261A38;--surface-2:#31224A;--text:#F1EAF6;--muted:#B3A6C6;--border:#3A2C55;--primary:#C7A9DF;--primary-deep:#E7D9F2;--secondary:#E7A8CB;--accent:#8FB0D8;--radius:10px;--header-bg:#261A38;--header-text:#F1EAF6;--hero-bg:linear-gradient(160deg,#2E1C40 0%,#1A1226 60%,#3A2C55 100%)}
/* --- Preset 3: Soft Blossom --- */
html[data-preset="blossom"][data-mode="light"]{--bg:#FDFBFD;--surface:#FFFFFF;--surface-2:#F8F0F5;--text:#3A3340;--muted:#7A7480;--border:#EEE3EC;--primary:#A77BC5;--primary-deep:#79509B;--secondary:#F3D6E7;--accent:#668FC2;--radius:24px;--header-bg:#FDFBFD;--header-text:#3A3340;--hero-bg:linear-gradient(180deg,#FDFBFD 0%,#F8F0F5 100%)}
html[data-preset="blossom"][data-mode="dark"]{--bg:#241E26;--surface:#2E2833;--surface-2:#3A3040;--text:#F4EEF4;--muted:#B8AFBC;--border:#453A4A;--primary:#C7A9DF;--primary-deep:#E7D9F2;--secondary:#E7A8CB;--accent:#8FB0D8;--radius:24px;--header-bg:#2E2833;--header-text:#F4EEF4;--hero-bg:linear-gradient(180deg,#2E2833 0%,#241E26 100%)}
/* --- Preset 4: Midnight Orchid (dark-first editorial) --- */
html[data-preset="midnight"][data-mode="light"]{--bg:#2A1F3D;--surface:#352A4A;--surface-2:#41335C;--text:#F4EFF9;--muted:#C9BFD9;--border:#4A3A66;--primary:#C7A9DF;--primary-deep:#E7D9F2;--secondary:#E7A8CB;--accent:#8FB0D8;--soft-blue:#31405E;--soft-pink:#4A3350;--radius:14px;--header-bg:#241A33;--header-text:#F4EFF9;--hero-bg:radial-gradient(1000px 400px at 70% -10%,rgba(167,123,197,.35),transparent 60%),linear-gradient(160deg,#2A1F3D,#241A33)}
html[data-preset="midnight"][data-mode="dark"]{--bg:#17102A;--surface:#211640;--surface-2:#2C1E52;--text:#F4EFF9;--muted:#BFB2D6;--border:#3A2C5E;--primary:#C7A9DF;--primary-deep:#E7D9F2;--secondary:#E7A8CB;--accent:#8FB0D8;--radius:14px;--header-bg:#17102A;--header-text:#F4EFF9;--hero-bg:radial-gradient(1000px 400px at 70% -10%,rgba(167,123,197,.28),transparent 60%),linear-gradient(160deg,#17102A,#120B22)}
/* --- Preset 5: Modern Editorial --- */
html[data-preset="editorial"][data-mode="light"]{--bg:#FFFFFF;--surface:#F7F5F2;--surface-2:#EFECE7;--text:#1F1B2E;--muted:#6E6A75;--border:#DDD6CE;--primary:#49305F;--primary-deep:#241533;--secondary:#668FC2;--accent:#668FC2;--soft-blue:#E7EFF8;--soft-pink:#F3D6E7;--radius:2px;--header-bg:#FFFFFF;--header-text:#1F1B2E;--hero-bg:linear-gradient(180deg,#FFFFFF 0%,#F7F5F2 100%)}
html[data-preset="editorial"][data-mode="dark"]{--bg:#191419;--surface:#241E24;--surface-2:#2E282E;--text:#F2EDEA;--muted:#B5AEB2;--border:#3D343C;--primary:#C7A9DF;--primary-deep:#E7D9F2;--secondary:#8FB0D8;--accent:#8FB0D8;--radius:2px;--header-bg:#241E24;--header-text:#F2EDEA;--hero-bg:linear-gradient(180deg,#241E24 0%,#191419 100%)}
/* Custom colour overrides from Design Studio */
html{--c-primary:var(--primary);--c-secondary:var(--secondary);--c-blue:var(--accent);--c-gray:var(--gray)}

html{scroll-behavior:smooth}
body{margin:0;font-family:var(--font-body);background:var(--bg);color:var(--text);line-height:1.75;transition:background .3s,color .3s;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-head);line-height:1.35;margin:0 0 .5em;color:var(--text)}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] h4{font-family:'Cairo',sans-serif;font-weight:800}
a{color:var(--c-primary);text-decoration:none}
a:hover{text-decoration:underline}
img{max-width:100%;height:auto;display:block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:1rem}
.container{max-width:var(--max);margin:0 auto;padding:0 20px}
.section{padding:56px 0}
.section-label{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c-primary);margin-bottom:10px}
html[data-preset="editorial"] .section-label{letter-spacing:.22em;border-bottom:2px solid var(--c-secondary);padding-bottom:4px}
.section-title{font-size:clamp(1.6rem,3.4vw,2.3rem);margin-bottom:8px}
.section-sub{color:var(--muted);max-width:640px;margin:0 0 28px}
/* --- Header --- */
.site-header{position:sticky;top:0;z-index:50;background:var(--header-bg);color:var(--header-text);border-bottom:1px solid var(--border);backdrop-filter:blur(8px)}
html[data-preset="royal"][data-mode="light"] .site-header{border-bottom:1px solid rgba(255,255,255,.18)}
.header-inner{max-width:var(--max);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:12px;color:inherit}
.brand:hover{text-decoration:none}
.brand-img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--c-secondary);background:var(--surface-2)}
.brand-logo{width:46px;height:46px;border-radius:12px;object-fit:contain;background:var(--surface-2);border:1px solid var(--border)}
.brand-mark{width:46px;height:46px;border-radius:50%;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:1.4rem;font-weight:700;flex:none}
.brand-name{font-family:var(--font-head);font-weight:800;font-size:1.25rem;line-height:1.1}
html[lang="ar"] .brand-name{font-family:'Cairo',sans-serif}
.brand-sub{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.main-nav{margin-inline-start:auto;display:flex;gap:4px;align-items:center}
.main-nav a{padding:8px 12px;border-radius:10px;color:inherit;font-weight:600;font-size:.95rem}
.main-nav a:hover{background:var(--surface-2);text-decoration:none}
.main-nav a.active{background:var(--c-primary);color:#fff}
.icon-btn{background:transparent;border:1px solid var(--border);color:inherit;border-radius:10px;padding:7px 11px;font-size:.9rem;font-weight:600}
.icon-btn:hover{background:var(--surface-2)}
.menu-btn{display:none}
.mobile-nav{display:none}
/* --- Buttons --- */
.btn{display:inline-block;padding:12px 26px;border-radius:999px;border:1px solid transparent;font-weight:700;font-size:.98rem;transition:transform .15s,box-shadow .15s,background .2s}
.btn:hover{text-decoration:none;transform:translateY(-1px)}
.btn-primary{background:var(--c-primary);color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--primary-deep)}
.btn-ghost{background:transparent;border-color:var(--c-primary);color:var(--c-primary)}
.btn-blue{background:var(--c-blue);color:#fff}
.btn-sm{padding:8px 16px;font-size:.88rem}
/* --- Hero --- */
.hero{background:var(--hero-bg);padding:72px 0 64px;border-bottom:1px solid var(--border)}
.hero-inner{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(2.2rem,5vw,3.4rem);margin-bottom:6px}
.hero h1 .flower{color:var(--c-primary)}
.hero-tag{font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:700;color:var(--primary-deep);margin:0 0 16px}
html[data-mode="dark"] .hero-tag{color:var(--primary)}
.hero-intro{color:var(--muted);font-size:1.05rem;max-width:560px;margin-bottom:26px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-photo{border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:var(--surface-2);min-height:280px;display:flex;align-items:center;justify-content:center;position:relative}
.hero-photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.hero-photo .ph{font-family:var(--font-head);font-size:6rem;color:var(--c-primary);opacity:.5}
/* --- Cards --- */
.grid{display:grid;gap:var(--gap)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
.post-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.post-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
html[data-preset="editorial"] .post-card{border-top:3px solid var(--c-primary)}
.post-cover{height:190px;background:var(--surface-2);position:relative;overflow:hidden}
.post-cover img{width:100%;height:100%;object-fit:cover}
.post-cover .cover-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:3rem;color:var(--c-primary);opacity:.45}
.post-body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.cat-chip{display:inline-block;font-size:.75rem;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--soft-pink);color:var(--primary-deep);width:fit-content}
.cat-chip.blue{background:var(--soft-blue);color:var(--c-blue)}
.post-body h3{font-size:1.25rem;margin:0}
.post-body h3 a{color:var(--text)}
.post-body h3 a:hover{color:var(--c-primary)}
.post-excerpt{color:var(--muted);font-size:.95rem;flex:1}
.post-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.sample-badge{display:inline-block;font-size:.72rem;font-weight:700;background:#FFF3CD;color:#7A5A00;border:1px solid #E8D48A;border-radius:6px;padding:2px 8px}
html[data-mode="dark"] .sample-badge{background:#4A3D1A;color:#F2D98C;border-color:#6B5A26}
.featured-badge{display:inline-block;font-size:.72rem;font-weight:700;background:var(--c-primary);color:#fff;border-radius:6px;padding:2px 8px}
/* --- Philosophy / quote --- */
.quote-block{background:var(--surface);border:1px solid var(--border);border-inline-start:5px solid var(--c-primary);border-radius:var(--radius-sm);padding:28px 30px;font-size:1.25rem;font-weight:600;line-height:1.9}
.quote-block footer{font-size:.9rem;color:var(--muted);font-weight:400;margin-top:12px}
/* --- About preview --- */
.about-preview{display:grid;grid-template-columns:200px 1fr;gap:32px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px}
.about-preview img{width:200px;height:200px;border-radius:50%;object-fit:cover;border:4px solid var(--c-secondary)}
.about-preview .avatar-ph{width:200px;height:200px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-size:4rem;color:var(--c-primary)}
/* --- Footer --- */
.site-footer{background:var(--primary-deep);color:#EFE7F5;margin-top:64px}
html[data-preset="midnight"] .site-footer{background:#17102A}
.site-footer a{color:#fff}
.footer-inner{max-width:var(--max);margin:0 auto;padding:48px 20px 28px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px}
.site-footer h4{color:#fff;font-size:1.05rem}
.site-footer p,.site-footer li{font-size:.92rem;opacity:.9}
.footer-bottom{border-top:1px solid rgba(255,255,255,.18);padding:16px 20px;text-align:center;font-size:.85rem;opacity:.85}
.social-links{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.social-links a{display:inline-flex;align-items:center;justify-content:center;min-width:38px;height:38px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:.85rem;font-weight:600}
.social-links a:hover{background:var(--c-secondary);color:var(--primary-deep);text-decoration:none}

/* --- Article page --- */
.article-wrap{max-width:760px;margin:0 auto}
.article-cover{border-radius:var(--radius);overflow:hidden;margin:24px 0;box-shadow:var(--shadow)}
.article-cover img{width:100%;max-height:420px;object-fit:cover}
.article-title{font-size:clamp(1.8rem,4vw,2.6rem)}
.article-body{font-size:1.12rem;line-height:2}
.article-body p{margin:0 0 1.1em}
.article-body h2{font-size:1.5rem;margin:1.4em 0 .5em}
.article-body h3{font-size:1.25rem;margin:1.2em 0 .4em}
.article-body ul,.article-body ol{padding-inline-start:1.4em;margin:0 0 1.1em}
.article-body blockquote{border-inline-start:4px solid var(--c-secondary);background:var(--surface-2);margin:1.2em 0;padding:14px 20px;border-radius:8px;font-style:italic}
.article-body img{border-radius:12px;margin:1em 0}
.article-body a{color:var(--c-primary);text-decoration:underline}
html[data-preset="editorial"] .article-body>p:first-of-type::first-letter{font-family:var(--font-head);font-size:3.4em;float:inline-start;line-height:.85;padding-inline-end:10px;color:var(--c-primary);font-weight:700}
.share-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:16px 0;margin:32px 0}
.related h2{margin-bottom:18px}
/* --- Filters / search --- */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.search-input{flex:1;min-width:220px;padding:12px 16px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text)}
.chip-btn{padding:8px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:.9rem}
.chip-btn.active{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
.chip-btn.blue.active{background:var(--c-blue);border-color:var(--c-blue)}
/* --- Forms --- */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow-sm)}
.field{margin-bottom:18px}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:.95rem}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--bg);color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--c-primary);outline-offset:1px}
.field .hint{font-size:.82rem;color:var(--muted);margin-top:4px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.check-row{display:flex;gap:8px;align-items:center;font-weight:600}
.alert{padding:14px 18px;border-radius:12px;margin-bottom:18px;font-weight:600}
.alert-success{background:#E6F4EA;color:#1B5E20;border:1px solid #B7DFC0}
.alert-error{background:#FDECEA;color:#8B1E1E;border:1px solid #F5C6C2}
html[data-mode="dark"] .alert-success{background:#17301C;color:#A7E5B4}
html[data-mode="dark"] .alert-error{background:#3A1A18;color:#F5B8B2}
.hidden-hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden}
/* --- Admin --- */
.admin-shell{display:grid;grid-template-columns:230px 1fr;gap:0;align-items:start}
.admin-side{position:sticky;top:73px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-inline-end:20px}
.admin-side a{display:block;padding:9px 12px;border-radius:10px;color:var(--text);font-weight:600;font-size:.93rem}
.admin-side a:hover{background:var(--surface-2);text-decoration:none}
.admin-side a.active{background:var(--c-primary);color:#fff}
.admin-side .count-badge{background:var(--c-secondary);color:var(--primary-deep);border-radius:999px;font-size:.72rem;padding:1px 8px;margin-inline-start:6px;font-weight:800}
.admin-main{min-width:0}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.stat-card .num{font-size:2rem;font-weight:800;color:var(--c-primary);line-height:1.1}
.stat-card .lbl{color:var(--muted);font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:20px}
.panel h3{margin-bottom:14px}
.table{width:100%;border-collapse:collapse;font-size:.93rem}
.table th,.table td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
.table th{color:var(--muted);font-size:.82rem}
.table tr:hover td{background:var(--surface-2)}
.badge{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 10px}
.badge-pub{background:#E6F4EA;color:#1B5E20}
.badge-draft{background:var(--light-gray);color:var(--dark-gray)}
.badge-new{background:var(--c-primary);color:#fff}
.badge-read{background:var(--light-gray);color:var(--dark-gray)}
html[data-mode="dark"] .badge-draft,html[data-mode="dark"] .badge-read{background:#3A3040;color:#CFC6DB}
.msg-item{border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;background:var(--surface)}
.msg-item.unread{border-inline-start:4px solid var(--c-primary);background:var(--surface-2)}
.msg-item .msg-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer}

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));

/* ================= IndexedDB ================= */
const DB_NAME = 'areej-flowers';
const DB_VERSION = 1;
const STORES = ['posts', 'categories', 'media', 'messages', 'settings', 'profile', 'auth'];
let dbp = null;
function openDB(){
  if (dbp) return dbp;
  dbp = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      STORES.forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, {keyPath: 'id', autoIncrement: true}); });
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
  return dbp;
}
function put(store, val){ return openDB().then(db => new Promise((resolve, reject) => {
  const t = db.transaction(store, 'readwrite'); const r = t.objectStore(store).put(val);
  r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error);
}));}
function get(store, id){ return openDB().then(db => new Promise((resolve, reject) => {
  const r = db.transaction(store, 'readonly').objectStore(store).get(id);
  r.onsuccess = () => resolve(r.result || null); r.onerror = () => reject(r.error);
}));}
function all(store){ return openDB().then(db => new Promise((resolve, reject) => {
  const r = db.transaction(store, 'readonly').objectStore(store).getAll();
  r.onsuccess = () => resolve(r.result || []); r.onerror = () => reject(r.error);
}));}
function del(store, id){ return openDB().then(db => new Promise((resolve, reject) => {
  const t = db.transaction(store, 'readwrite'); t.objectStore(store).delete(id);
  t.oncomplete = () => resolve(); t.onerror = () => reject(t.error);
}));}
function clearStore(store){ return openDB().then(db => new Promise((resolve, reject) => {
  const t = db.transaction(store, 'readwrite'); t.objectStore(store).clear();
  t.oncomplete = () => resolve(); t.onerror = () => reject(t.error);
}));}
/* Settings / profile are single records with fixed id 'site' / 'profile' */
async function getSettings(){ const s = await get('settings', 1); return s || null; }
async function saveSettings(patch){
  const cur = (await getSettings()) || {};
  const next = Object.assign({}, cur, patch, {id: 1});
  await put('settings', next); return next;
}
async function getProfile(){ const p = await get('profile', 1); return p || null; }
async function saveProfile(patch){
  const cur = (await getProfile()) || {};
  const next = Object.assign({}, cur, patch, {id: 1});
  await put('profile', next); return next;
}

  root.setAttribute('data-preset', preset);

/* ================= Media helpers ================= */
const mediaUrlCache = new Map();
async function mediaUrl(id){
  if (!id) return null;
  if (mediaUrlCache.has(id)) return mediaUrlCache.get(id);
  const m = await get('media', id);
  if (!m || !m.blob) return null;
  const url = URL.createObjectURL(m.blob);
  mediaUrlCache.set(id, url);
  return url;
}
function catName(cat, lang){
  if (!cat) return '';
  return lang === 'ar' ? (cat.nameAr || cat.name) : (cat.nameEn || cat.nameAr || cat.name);
}
function postTitle(p, lang){
  return lang === 'ar' ? p.title : (p.titleEn || p.title);
}
function postExcerpt(p, lang){

}

async function enrichPosts(posts){
  for (const p of posts){
    p._coverUrl = p.coverId ? await mediaUrl(p.coverId) : null;
  }
  return posts;
}
function socialLinksHtml(social){
  const labels = {facebook: 'Facebook', instagram: 'Instagram', x: 'X', youtube: 'YouTube', tiktok: 'TikTok', whatsapp: 'WhatsApp'};
  return Object.keys(labels).filter(k => social && social[k]).map(k =>
    '<a href="' + esc(social[k]) + '" target="_blank" rel="noopener">' + labels[k] + '</a>').join('');
}
function setMeta(title, desc){
  document.title = title;
  let m = document.querySelector('meta[name="description"]');
  if (m) m.setAttribute('content', desc || '');
  let og = document.querySelector('meta[property="og:title"]');
  if (og) og.setAttribute('content', title);
  let ogd = document.querySelector('meta[property="og:description"]');
  if (ogd) ogd.setAttribute('content', desc || '');
}

/* ================= Router ================= */
const NAV = [
  ['#/', 'nav.home'], ['#/about', 'nav.about'], ['#/writings', 'nav.writings'],
  ['#/educational', 'nav.educational'], ['#/journal', 'nav.journal'], ['#/contact', 'nav.contact']
];
function currentHash(){ return location.hash || '#/'; }
async function render(){
  const app = $('#app');
  const hash = currentHash();
  const settings = window.__settings || {};
  const profile = window.__profile || {};
  renderHeader(settings, profile);
  renderFooter(settings, profile);
  window.scrollTo(0, 0);
  const parts = hash.replace(/^#\//, '').split('/');
  try {
    if (hash.startsWith('#/admin')) { await renderAdmin(parts.slice(1)); return; }
    if (hash.startsWith('#/post/')) { await renderArticle(parts[1]); return; }
    if (hash === '#/' || hash === '') { await renderHome(); return; }
    if (hash === '#/about') { await renderAbout(); return; }
    if (hash === '#/writings') { await renderWritings(); return; }
    if (hash === '#/educational') { await renderSection('educational'); return; }
    if (hash === '#/journal') { await renderSection('journal'); return; }
    if (hash === '#/contact') { renderContact(); return; }
    await renderHome();
  } catch (err) {
    app.innerHTML = '<div class="empty-state"><div class="big">⚠</div><p>' + esc(String(err && err.message || err)) + '</p></div>';
  }
}
function renderHeader(settings, profile){
  const nav = $('#mainNav');
  const hash = currentHash();
  nav.innerHTML = NAV.map(([href, key]) =>
    '<a href="' + href + '" class="' + ((hash === href || (href !== '#/' && hash.startsWith(href))) ? 'active' : '') + '">' + esc(t(key)) + '</a>').join('') +
    '<a href="#/admin">' + esc(t('nav.admin')) + '</a>';
  const mn = $('#mobileNav');
  mn.innerHTML = NAV.map(([href, key]) =>
    '<a href="' + href + '" class="' + (hash === href ? 'active' : '') + '">' + esc(t(key)) + '</a>').join('') +
    '<a href="#/admin">' + esc(t('nav.admin')) + '</a>';
  const lb = $('#langBtn'); if (lb) lb.textContent = LANG === 'ar' ? 'EN' : 'عربي';
  const bn = $('#brandName'); if (bn) bn.textContent = settings.siteName || 'Areej Flowers';
  const bs = $('#brandSub'); if (bs) bs.textContent = LANG === 'ar' ? (profile.nameAr || '') : (profile.nameEn || profile.nameAr || '');
  const bv = $('#brandVisual');
  renderBrandVisual(bv, settings, profile);
}
async function renderBrandVisual(el, settings, profile){
  if (!el) return;
  if (settings.headerIdentity === 'photo' && profile.photoId){
    const url = await mediaUrl(profile.photoId);
    if (url){ el.innerHTML = '<img class="brand-img" src="' + url + '" alt="">'; return; }
  }
  if (settings.logoId){
    const url = await mediaUrl(settings.logoId);
    if (url){ el.innerHTML = '<img class="brand-logo" src="' + url + '" alt="">'; return; }
  }
  el.innerHTML = '<span class="brand-mark">A</span>';
}

      const q = writingsState.q.toLowerCase();
      const hay = ((p.title || '') + ' ' + (p.titleEn || '') + ' ' + (p.excerpt || '') + ' ' + (p.excerptEn || '') + ' ' + (p.content || '').replace(/<[^>]*>/g, ' ')).toLowerCase();

  });

}

function renderContact(){
  const app = $('#app');
  const settings = window.__settings || {};
  setMeta(t('contact.title') + ' | ' + (settings.siteName || 'Areej Flowers'), t('contact.sub'));
  app.innerHTML = '<div class="page-head"><span class="section-label">✿ ' + esc(t('contact.title')) + '</span><h1>' + esc(t('contact.title')) + '</h1><p class="section-sub">' + esc(t('contact.sub')) + '</p></div>' +
    '<div class="form-card" style="max-width:640px"><div id="cAlert"></div>' +
    '<form id="contactForm" novalidate>' +
      '<div class="hidden-hp"><label>Website <input type="text" name="website" id="cHp" tabindex="-1" autocomplete="off"></label></div>' +
      '<div class="field"><label for="cName">' + esc(t('form.name')) + ' *</label><input id="cName" name="name" required minlength="2" maxlength="80"></div>' +
      '<div class="field"><label for="cSubject">' + esc(t('form.subject')) + ' *</label><input id="cSubject" name="subject" required minlength="2" maxlength="120"></div>' +
      '<div class="field"><label for="cMsg">' + esc(t('form.message')) + ' *</label><textarea id="cMsg" name="message" rows="6" required minlength="5" maxlength="5000"></textarea></div>' +
      '<button class="btn btn-primary" id="cSend" type="submit">' + esc(t('form.send')) + '</button>' +
    '</form></div>';
  $('#contactForm').addEventListener('submit', async e => {
    e.preventDefault();
    const alertBox = $('#cAlert');
    const name = $('#cName').value.trim();
    const subject = $('#cSubject').value.trim();
    const body = $('#cMsg').value.trim();
    const hp = $('#cHp').value.trim();
    const fail = msg => { alertBox.innerHTML = '<div class="alert alert-error">' + esc(msg) + '</div>'; };
    if (!name || name.length < 2) return fail(t('form.nameShort'));
    if (!subject) return fail(t('form.req'));
    if (!body || body.length < 5) return fail(t('form.msgShort'));
    if (hp){ // honeypot: bot — pretend success, never store
      alertBox.innerHTML = '<div class="alert alert-success">' + esc(t('form.success')) + '</div>';
      e.target.reset(); return;
    }
    // Rate limit: 5 messages per 10 minutes (localStorage)
    let times = [];
    try { times = JSON.parse(localStorage.getItem('af_msg_times') || '[]'); } catch(err){}
    const now = Date.now();
    times = times.filter(x => now - x < 10 * 60 * 1000);
    if (times.length >= 5) return fail(t('form.rate'));
    times.push(now);
    try { localStorage.setItem('af_msg_times', JSON.stringify(times)); } catch(err){}
    const btn = $('#cSend'); btn.disabled = true; btn.textContent = t('form.sending');
    try {
      await put('messages', {name, subject, body, createdAt: now, read: false});
      alertBox.innerHTML = '<div class="alert alert-success">' + esc(t('form.success')) + '</div>';
      e.target.reset();
    } catch(err){ fail(String(err && err.message || err)); }
    btn.disabled = false; btn.textContent = t('form.send');
  });
}

async function handleImageUpload(file){
  if (!file) return null;
  if (!file.type.startsWith('image/')){ toast(t('media.max')); return null; }
  if (file.size > 4 * 1024 * 1024){ toast(t('media.max')); return null; }
  const id = await put('media', {name: file.name, type: file.type, size: file.size, blob: file, createdAt: Date.now()});
  mediaUrlCache.delete(id);
  return id;
}
async function adminMedia(main){
  const items = (await all('media')).sort((a, b) => b.createdAt - a.createdAt);

  const usedIds = new Set();
  posts.forEach(p => { if (p.coverId) usedIds.add(p.coverId); });

      const url = mediaUrlCache.get(m.id);
      return '<div class="media-item" data-mid="' + m.id + '"><div class="mi-img" data-src="' + m.id + '">' + (url ? '<img src="' + url + '" alt="">' : '<div style="height:110px;background:var(--surface-2);display:flex;align-items:center;justify-content:center">🖼</div>') + '</div>' +
      '<div class="mi-body"><div class="name">' + esc(m.name) + '</div><div class="meta">' + (m.size / 1024).toFixed(0) + ' KB' + (usedIds.has(m.id) ? ' · ✦' : '') + '</div>' +
      '<div style="margin-top:8px;display:flex;gap:8px"><a href="#" data-view="' + m.id + '">' + esc(t('msg.open')) + '</a> · <a href="#" data-del="' + m.id + '" data-used="' + (usedIds.has(m.id) ? 1 : 0) + '">' + esc(t('admin.delete')) + '</a></div></div></div>';
    }).join('') + '</div>' : '<p style="color:var(--muted)">' + esc(t('msg.empty')) + '</p>') + '</div>';
  for (const m of items){
    if (!mediaUrlCache.has(m.id)){
      const url = await mediaUrl(m.id);
      const holder = main.querySelector('[data-src="' + m.id + '"]');
      if (holder && url) holder.innerHTML = '<img src="' + url + '" alt="">';
    }
  }
  $('#mediaFile').addEventListener('change', async e => {
    const id = await handleImageUpload(e.target.files[0]);
    if (id){ toast(t('admin.saved')); render(); }

  $$('[data-del]', main).forEach(a => a.addEventListener('click', async e => {
    e.preventDefault();
    if (a.dataset.used === '1' && !confirm(t('media.usedWarn'))) return;
    if (a.dataset.used !== '1' && !confirm(t('admin.confirmDelete'))) return;
    await del('media', Number(a.dataset.del));

    toast(t('admin.deleted')); render();
  }));
  $$('[data-view]', main).forEach(a => a.addEventListener('click', async e => {
    e.preventDefault();
    const url = await mediaUrl(Number(a.dataset.view));
    if (url) window.open(url, '_blank');
  }));
}

    '<div class="field"><label>' + esc(t('set.siteDesc')) + ' (English)</label><textarea id="sDescEn" rows="2">' + esc(settings.taglineEn || '') + '</textarea></div>' +
    '<div class="field-row"><div class="field"><label>' + esc(t('set.defLang')) + '</label><select id="sLang"><option value="ar"' + (settings.lang !== 'en' ? ' selected' : '') + '>العربية</option><option value="en"' + (settings.lang === 'en' ? ' selected' : '') + '>English</option></select></div>' +
    '<div class="field"><label>' + esc(t('set.defMode')) + '</label><select id="sMode"><option value="light"' + (settings.mode !== 'dark' ? ' selected' : '') + '>' + esc(t('set.light')) + '</option><option value="dark"' + (settings.mode === 'dark' ? ' selected' : '') + '>' + esc(t('set.dark')) + '</option></select></div></div>' +
    '<div class="field"><label>' + esc(t('set.footerText')) + ' (عربي)</label><textarea id="sFootAr" rows="2">' + esc(settings.footerAr || '') + '</textarea></div>' +
    '<div class="field"><label>' + esc(t('set.footerText')) + ' (English)</label><textarea id="sFootEn" rows="2">' + esc(settings.footerEn || '') + '</textarea></div>' +
    '<h3 style="margin-top:20px">' + esc(t('set.social')) + '</h3>' +
    ['facebook', 'instagram', 'x', 'youtube', 'tiktok', 'whatsapp'].map(k =>
      '<div class="field"><label>' + k.charAt(0).toUpperCase() + k.slice(1) + '</label><input data-soc="' + k + '" value="' + esc(social[k] || '') + '" placeholder="https://"></div>').join('') +
    '<button class="btn btn-primary" type="submit">' + esc(t('admin.save')) + '</button></form></div>';
  $('#setForm').addEventListener('submit', async e => {
    e.preventDefault();
    const nextSocial = {};
    $$('[data-soc]', main).forEach(inp => { if (inp.value.trim()) nextSocial[inp.dataset.soc] = inp.value.trim(); });
    const lang = $('#sLang').value, mode = $('#sMode').value;
    window.__settings = await saveSettings({
      siteName: $('#sTitle').value.trim() || 'Areej Flowers',
      taglineAr: $('#sDescAr').value.trim(), taglineEn: $('#sDescEn').value.trim(),
      footerAr: $('#sFootAr').value.trim(), footerEn: $('#sFootEn').value.trim(),
      social: nextSocial
    });
    if (mode !== (window.__settings.mode || 'light')) { await setMode(mode); }
    if (lang !== LANG) { await setLang(lang); return; }
    toast(t('admin.saved')); render();
  });
}
async function adminMessages(main, openId){
  const msgs = (await all('messages')).sort((a, b) => b.createdAt - a.createdAt);
  const unread = msgs.filter(m => !m.read).length;
  main.innerHTML = '<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px"><h3 style="margin:0">' + esc(t('admin.messages')) + ' (' + msgs.length + ')</h3><span class="badge badge-new">' + unread + ' ' + esc(t('msg.unread')) + '</span></div>' +
    (msgs.length ? msgs.map(m => {
      const open = String(openId) === String(m.id);
      return '<div class="msg-item' + (m.read ? '' : ' unread') + '" data-mid="' + m.id + '">' +
        '<div class="msg-head" data-open="' + m.id + '"><strong>' + esc(t('msg.from')) + ': ' + esc(m.name) + '</strong><span>— ' + esc(m.subject) + '</span>' +
        '<span class="badge ' + (m.read ? 'badge-read' : 'badge-new') + '">' + esc(t(m.read ? 'msg.read' : 'msg.unread')) + '</span>' +
        '<span class="msg-date">' + esc(fmtDate(m.createdAt, LANG)) + '</span></div>' +
        (open ? '<div class="msg-body">' + esc(m.body) + '</div>' +
          '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
          '<button class="btn btn-ghost btn-sm" data-toggle="' + m.id + '" type="button">' + esc(t(m.read ? 'msg.markUnread' : 'msg.markRead')) + '</button>' +
          '<button class="btn btn-ghost btn-sm" data-delmsg="' + m.id + '" type="button">' + esc(t('admin.delete')) + '</button></div>' : '') +
        '</div>';
    }).join('') : '<p style="color:var(--muted)">' + esc(t('msg.empty')) + '</p>') + '</div>';
  $$('[data-open]', main).forEach(h => h.addEventListener('click', async () => {
    const id = Number(h.dataset.open);
    const m = await get('messages', id);
    if (m && !m.read){ await put('messages', Object.assign({}, m, {read: true})); }
    location.hash = '#/admin/messages/' + id; render();
  }));
  $$('[data-toggle]', main).forEach(b => b.addEventListener('click', async () => {
    const m = await get('messages', Number(b.dataset.toggle));
    if (m){ await put('messages', Object.assign({}, m, {read: !m.read})); render(); }
  }));
  $$('[data-delmsg]', main).forEach(b => b.addEventListener('click', async () => {
    if (!confirm(t('admin.confirmDelete'))) return;
    await del('messages', Number(b.dataset.delmsg));
    toast(t('admin.deleted')); location.hash = '#/admin/messages'; render();
  }));
}
async function adminSeo(main){
  const settings = window.__settings || {};
  main.innerHTML = '<div class="panel"><h3>' + esc(t('admin.seo')) + '</h3>' +
    '<p style="color:var(--muted)">' + esc(t('seo.note')) + '</p>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
    '<button class="btn btn-primary btn-sm" id="dlSitemap" type="button">' + esc(t('seo.sitemap')) + '</button>' +
    '<button class="btn btn-ghost btn-sm" id="dlRobots" type="button">' + esc(t('seo.robots')) + '</button></div>' +
    '<h3 style="margin-top:24px">JSON-LD</h3><pre id="ldJson" style="background:var(--surface-2);padding:16px;border-radius:12px;overflow:auto;font-size:.8rem;direction:ltr;text-align:left"></pre></div>';
  const profile = window.__profile || {};
  const ld = {
    '@context': 'https://schema.org', '@type': 'Blog',
    name: settings.siteName || 'Areej Flowers',
    description: settings.taglineAr || '',
    author: {'@type': 'Person', name: profile.nameEn || profile.nameAr || '', jobTitle: 'Writer'},
    inLanguage: 'ar'
  };
  $('#ldJson').textContent = JSON.stringify(ld, null, 2);
  $('#dlSitemap').addEventListener('click', async () => {
    const posts = (await all('posts')).filter(p => p.status === 'published');
    const base = location.href.split('#')[0].replace(/[^/]*$/, '');
    let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n';
    xml += '  <url><loc>' + base + '#/</loc></url>\n';
    ['#/about', '#/writings', '#/educational', '#/journal', '#/contact'].forEach(r => { xml += '  <url><loc>' + base + r + '</loc></url>\n'; });
    posts.forEach(p => { xml += '  <url><loc>' + base + '#/post/' + p.slug + '</loc><lastmod>' + new Date(p.publishedAt).toISOString().slice(0, 10) + '</lastmod></url>\n'; });
    xml += '</urlset>\n';
    downloadFile('sitemap.xml', xml, 'application/xml');
  });
  $('#dlRobots').addEventListener('click', () => {
    downloadFile('robots.txt', 'User-agent: *\nAllow: /\nSitemap: ' + location.href.split('#')[0].replace(/[^/]*$/, '') + 'sitemap.xml\n', 'text/plain');
  });
}
async function adminAccount(main){
  main.innerHTML = '<div class="panel"><h3>' + esc(t('acc.changePin')) + '</h3><div id="accAlert"></div>' +
    '<form id="pinForm"><div class="field"><label>' + esc(t('admin.pinOld')) + '</label><input type="password" id="oldPin" required autocomplete="current-password"></div>' +
    '<div class="field"><label>' + esc(t('admin.pinNew')) + '</label><input type="password" id="newPin" required minlength="6" autocomplete="new-password"></div>' +
    '<div class="field"><label>' + esc(t('admin.pinConfirm')) + '</label><input type="password" id="newPin2" required minlength="6" autocomplete="new-password"></div>' +
    '<button class="btn btn-primary" type="submit">' + esc(t('admin.save')) + '</button></form></div>' +
    '<div class="panel"><h3>' + esc(t('acc.deleteSamples')) + '</h3><p style="color:var(--muted)">' + esc(t('sample.note')) + '</p>' +
    '<button class="btn btn-ghost" id="delSamples" type="button">' + esc(t('acc.deleteSamples')) + '</button></div>' +
    '<div class="panel"><h3>' + esc(t('acc.export')) + '</h3><button class="btn btn-ghost" id="expData" type="button">' + esc(t('acc.export')) + '</button></div>';
  $('#pinForm').addEventListener('submit', async e => {
    e.preventDefault();
    const rec = await get('auth', 1);
    const oldHash = await sha256(rec.salt + ':' + $('#oldPin').value);
    const box = $('#accAlert');
    if (oldHash !== rec.hash) return box.innerHTML = '<div class="alert alert-error">' + esc(t('admin.wrongPin')) + '</div>';
    if ($('#newPin').value.length < 6) return box.innerHTML = '<div class="alert alert-error">' + esc(t('admin.pinMin')) + '</div>';
    if ($('#newPin').value !== $('#newPin2').value) return box.innerHTML = '<div class="alert alert-error">' + esc(t('admin.pinMismatch')) + '</div>';
    const salt = uid();
    await put('auth', {id: 1, salt, hash: await sha256(salt + ':' + $('#newPin').value), createdAt: Date.now()});
    box.innerHTML = '<div class="alert alert-success">' + esc(t('admin.saved')) + '</div>';
  });
  $('#delSamples').addEventListener('click', async () => {
    if (!confirm(t('admin.confirmDelete'))) return;
    const posts = await all('posts');
    for (const p of posts.filter(x => x.isSample)) await del('posts', p.id);
    toast(t('acc.samplesDeleted')); render();
  });
  $('#expData').addEventListener('click', async () => {
    const data = {};
    for (const s of STORES){ data[s] = await all(s); }
    data.media = data.media.map(m => ({id: m.id, name: m.name, type: m.type, size: m.size, createdAt: m.createdAt}));
    downloadFile('areej-flowers-backup.json', JSON.stringify(data, null, 2), 'application/json');
  });
}

/* ================= Init ================= */
$('#langBtn').addEventListener('click', () => setLang(LANG === 'ar' ? 'en' : 'ar'));
$('#modeBtn').addEventListener('click', () => setMode((window.__settings && window.__settings.mode) === 'dark' ? 'light' : 'dark'));
$('#menuBtn').addEventListener('click', () => {
  const mn = $('#mobileNav');
  mn.style.display = mn.style.display === 'none' ? 'block' : 'none';
});
$('#mobileNav').addEventListener('click', e => { if (e.target.tagName === 'A') $('#mobileNav').style.display = 'none'; });
window.addEventListener('hashchange', render);
(async function init(){
  await seedIfNeeded();
  window.__settings = await getSettings();
  window.__profile = await getProfile();
  LANG = window.__settings.lang || 'ar';
  document.documentElement.setAttribute('lang', LANG);
  document.documentElement.setAttribute('dir', LANG === 'ar' ? 'rtl' : 'ltr');
  if (window.__settings.favicon){ const link = $('#faviconLink'); if (link) link.href = window.__settings.favicon; }
  applyTheme();
  render();
})();
</script>
